name: Deploy map to GitHub Pages

# Publishes the static map in map_v1/ to GitHub Pages on every push to main.
# After the first successful run, set Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called directly by update-data.yml. A push made with GITHUB_TOKEN does not
  # fire `on: push` workflows (GitHub's recursion guard), so the scheduled data
  # update has to invoke this deploy itself rather than rely on its own commit.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The tip of main, NOT the SHA this run was pinned to. A workflow run
          # is pinned to the commit that started it, so when update-data.yml
          # calls this workflow the default checkout predates the data commit
          # that job just pushed -- it published the previous map and reported
          # success. Left alone that repeats every week, always one run behind,
          # green every time. Pages should serve the tip of the default branch
          # regardless of which trigger got us here.
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload map_v1 as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: map_v1
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
